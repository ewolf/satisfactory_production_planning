<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satisfactory Production Calculator</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <!--
    ================================================================================
    SATISFACTORY PRODUCTION CALCULATOR - DEVELOPER NOTES
    ================================================================================
    
    CRITICAL: When modifying this file, UPDATE THIS COMMENT SECTION to reflect
    any changes to the architecture, flow, or key decisions.
    
    ================================================================================
    ARCHITECTURE OVERVIEW
    ================================================================================
    
    This calculator determines the buildings, resources, and power needed to produce
    target items in Satisfactory, accounting for:
    - Belt/pipe capacity limits (items can't flow faster than infrastructure allows)
    - Input constraints (buildings can't run if inputs can't be delivered)
    - Power shard optimization (minimize buildings by overclocking with shards)
    - Underclocking (reduce power by running fewer buildings slower)
    
    ================================================================================
    CALCULATION FLOW
    ================================================================================
    
    1. RECURSIVE REQUIREMENT CALCULATION
       - Start with target items (e.g., "5 Smart Plating/min")
       - Recursively calculate all intermediate items and raw resources needed
       - Consolidate by building-item pair (e.g., all "Constructor → Screw" together)
       - Track which items consume each intermediate (for display)
    
    2. INPUT CONSTRAINT CHECKING (BEFORE SPLITTING)
       - Iteratively check if inputs can be delivered (belt/pipe capacity + supply)
       - Reduce production rates when inputs are bottlenecked
       - This stabilizes BEFORE we split prodconfs
       - Preserves inputConstrained/limitingInput/limitingReason flags
    
    3. CAPACITY-BASED SPLITTING
       - Split consolidated prodconfs ONLY when they exceed belt/pipe capacity
       - Example: 185 screws/min with 60/min belt → 4 prodconfs (60, 60, 60, 5)
       - Mark splits with isCapped flag (true for full-capacity splits only)
       - Preserve input constraint info from step 2
    
    4. RESOURCE ADJUSTMENT
       - Recalculate raw resource needs based on actual production rates
       - Adjust miner/extractor counts to match consumption
    
    5. OPTIMIZATION & DISPLAY
       - Optimize building counts with power shards (minimize buildings)
       - Calculate underclocking when buildings would overproduce
       - Calculate total power consumption
       - Display warnings for capacity limits and input constraints
    
    ================================================================================
    KEY DESIGN DECISIONS
    ================================================================================
    
    WHY NO POST-SPLIT CONSTRAINT CHECKING:
    - Input constraints are calculated BEFORE splitting to get stable rates
    - Splitting is purely about belt/pipe capacity, not production limits
    - Post-split checking would cause rates to change AFTER isCapped flags are set
    - This creates confusing UI where <60/min shows "belt limit reached" warning
    
    WHY CONSOLIDATE THEN SPLIT:
    - User wants to see ONE prodconf for "Screws" when possible
    - Only split into multiple when exceeding capacity (60/min on Belt Mk.1)
    - This keeps the UI clean: "2 Constructors" instead of two separate entries
    
    WHY TRACK CONSUMERS:
    - Shows "Used by: Rotor, Reinforced Iron Plate" on intermediates
    - Helps users understand the production chain
    
    ================================================================================
    COMMON PITFALLS TO AVOID
    ================================================================================
    
    1. DON'T do input constraint checking after splitting
       → Causes rates to change after isCapped flags are set
       → Results in confusing warnings
    
    2. DON'T use duplicate variable declarations (let, const)
       → Causes JavaScript syntax errors
       → Always check if variable already exists in scope
    
    3. DON'T forget to preserve constraint info when splitting
       → inputConstrained, limitingInput, limitingReason must carry over
       → Otherwise split prodconfs lose their warning context
    
    4. DON'T mark all splits as "capped"
       → Only full-capacity splits (at 60/60) should show belt warning
       → Remainder split (like 5/60) should not show warning
    
    5. DON'T recalculate resources before adjusting production
       → Calculate actual consumption AFTER all constraints are applied
       → Then update miner/extractor counts to match
    
    ================================================================================
    VARIABLE NAMING CONVENTIONS
    ================================================================================
    
    buildingProduction: Object mapping "Building|Item" to consolidated production data
    finalProdconfs: Array of split/unsplit prodconfs ready for display
    itemTotalProduction: Total production rate by item (used for constraint checking)
    actualResourceNeeds: Raw resources needed based on actual (constrained) production
    
    ================================================================================
    END OF DEVELOPER NOTES
    ================================================================================
    -->
    <div id="root"></div>

    <script type="text/babel" src="satrunner.js"></script>
</body>
</html>
