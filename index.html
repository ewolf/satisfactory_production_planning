    <!--
    ================================================================================
    SATISFACTORY PRODUCTION CALCULATOR - DEVELOPER NOTES
    ================================================================================

    ⚠️  IMPORTANT: This index.html loads satrunner.js, which is currently an
        INCOMPLETE implementation. The working calculator is in satprod.js.

    CRITICAL: When modifying this file, UPDATE THIS COMMENT SECTION to reflect
    any changes to the architecture, structure, or loaded files.

    ================================================================================
    CURRENT ARCHITECTURE (IN-PROGRESS REFACTOR)
    ================================================================================

    This HTML loads two JavaScript files:
    1. satdata.js - Game data definitions (items, recipes, buildings, constants)
    2. satrunner.js - React UI shell (INCOMPLETE - missing calculation logic)

    **Status:** Work-in-progress refactor. Full working implementation exists in
    satprod.js but is not referenced by this HTML file.

    ================================================================================
    SATDATA.JS - GAME DATA MODULE
    ================================================================================

    **Purpose:** Centralized repository of all Satisfactory game data

    **Data Structures:**

    1. CONSTS Object:
       - BELT_TIERS: Conveyor belt capacities (Mk.1: 60/min → Mk.6: 1200/min)
       - PIPE_TIERS: Pipeline capacities (Mk.1: 300 m³/min, Mk.2: 600 m³/min)
       - BUILDINGS: 15 building types with base power consumption
         Example: Constructor (4 MW), Manufacturer (55 MW), Particle Accelerator (500 MW)
       - ITEMS: Array of 113 items with properties:
         * item_id: Unique identifier (0-112)
         * name: Display name
         * is_fluid: Boolean (determines belt vs pipe)
         * is_ore: Raw mineable resource
         * is_resource: Any raw input (ores + fluids like water/oil)
         * is_fuel: Can be used for power generation
       - RECIPES: Array of 172 recipes (default + alternates):
         * id: Recipe ID
         * name: Recipe name (e.g., "Iron Ingot", "Alternate: Pure Iron Ingot")
         * building: Required building type
         * time: Crafting time in seconds
         * inputs: Array of {item_id, amount, rate}
         * outputs: Array of {item_id, rate, output} (supports byproducts)
         * isDefault: true for default recipes, false for alternates
         * replaces: (alternates only) name of default recipe it replaces

    2. Lookup Maps (generated at module load):
       - NAME2ITEM_ID: Item name → item_id (for UI dropdowns)
       - NAME2ITEM: Item name → full item object
       - BUILDING2IDS: Building name → building_id
       - DEFAULT_RECIPES: Filtered list of default recipes only
       - ALT_RECIPES: Filtered list of alternate recipes only
       - BUILDING2RECIPES: Map of building → array of recipes

    3. Item Enhancement:
       - Each item gets `item.recipes = {}` map of recipe name → recipe object
       - Each item gets `item.get_recipes(world)` function to filter applicable recipes

    **Key Functions:**

    recipesForItem(world):
      - Attached to each ITEMS entry
      - Returns array of applicable recipes for that item
      - Filters based on world.alt_recipes settings (user-selected alternates)
      - Sorts: default recipes first, then recipes producing this item

    setupProdConf(line, world):
      - Legacy production calculation function
      - Takes: production line with targetItems array
      - Recursively calculates all intermediate items and raw resources
      - Organizes into "tiers" (dependency depth)
      - Returns: line with populated tiers array
      - **Status:** May be deprecated - not connected to satrunner.js

    ================================================================================
    SATRUNNER.JS - REACT UI SHELL (INCOMPLETE)
    ================================================================================

    **Purpose:** React application for calculator UI (work in progress)

    **Current Implementation:**

    1. State Management:
       - useState for React state (world, productionLines, etc.)
       - Imports satdata.js to access CONSTS
       - Attempts to call satdata.setupProdConf() at initialization

    2. UI Components (JSX):
       - Global Settings section:
         * Conveyor Belt Tier selector (uses BELT_TIERS from satdata)
         * Miner Tier selector
         * Pipeline Tier selector
       - Alternate Recipes section:
         * Expandable panel showing available alternates
         * Toggle switches to enable/disable specific alternates
       - Data Management buttons:
         * Export to file
         * Import from file
         * Clear all data
       - localStorage integration for saving/loading state

    3. Missing Components:
       - Production calculation logic (NOT IMPLEMENTED)
       - calculateProduction() function referenced but undefined
       - Production line display/results rendering incomplete
       - No constraint checking or optimization logic

    **Data Flow (Intended but Incomplete):**
    ```
    User selects target items
        ↓
    (Missing: calculation function)
        ↓
    (Missing: results rendering)
    ```

    **What Works:**
    - Renders UI for settings selection
    - Can toggle alternate recipes
    - localStorage save/load structure exists

    **What Doesn't Work:**
    - No production calculation
    - No results display
    - References undefined variables/functions

    ================================================================================
    WHY THIS ARCHITECTURE
    ================================================================================

    **Separation of Concerns:**
    - satdata.js = Pure data (no UI, no React dependencies)
    - satrunner.js = UI layer (React components, user interaction)
    - This allows satdata.js to be used by other tools (Node.js scripts, tests)

    **Benefits:**
    - Data updates don't require touching UI code
    - Can test calculations independently of React
    - Multiple UIs can share same data module

    **Current Limitation:**
    - Calculation logic not yet implemented in this architecture
    - Working version (satprod.js) has inline data instead of importing satdata.js

    ================================================================================
    FILES IN THIS PROJECT
    ================================================================================

    index.html - This file (loads satrunner.js)
    satdata.js - Game data + legacy calculation function (172 recipes, 113 items)
    satrunner.js - Incomplete React UI (missing calculation logic)
    satprod.js - Working calculator implementation (not loaded here, has inline data)

    ================================================================================
    DEVELOPER NOTES
    ================================================================================

    If you're looking to understand the full calculation flow:
    → See satprod.js (the working implementation)

    If you're working on this refactored architecture:
    → Next step: Implement production calculation in satrunner.js
    → It should use satdata.ITEMS and satdata.RECIPES instead of inline data
    → Consider extracting calculation logic to separate module

    ================================================================================
    END OF DEVELOPER NOTES
    ================================================================================
    -->
    <div id="root"></div>

    <script type="text/babel" src="satrunner.js"></script>
